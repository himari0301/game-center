<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="top-bar">
    <span class="top-bar-left">
        ♟ ゲームセンター
        <a href="/" class="top-bar-home">♟ トップ</a>
    </span>
    <div class="top-bar-right">
        <a href="/login" class="top-bar-link">✦ ログイン</a>
        <a href="/register" class="top-bar-link">✧ 新規登録</a>
    </div>
</div>

<div class="card page-top-margin">
    <div class="gold-bar"></div>
    <h1 class="title">✧ 新規登録</h1>
    <p class="subtitle">— アカウントを作成しましょう —</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p class="flash-msg">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/register">
        <div class="form-group">
            <label class="form-label">ユーザー名（2〜20文字）</label>
            <input type="text" name="username" class="form-input"
                placeholder="ユーザー名を入力" required />
        </div>
        <div class="form-group">
            <label class="form-label">パスワード（4文字以上）</label>
            <input type="password" name="password" class="form-input"
                placeholder="パスワードを入力" required />
        </div>
        <button type="submit" class="btn-form">登録する</button>
    </form>

    <p class="form-link">すでにアカウントをお持ちの方は
        <a href="/login">ログインはこちら</a>
    </p>
    <div class="gold-bar" style="margin-top:1.5rem; margin-bottom:0;"></div>
</div>

<button onclick="history.back()" class="back-to-top">← 戻る</button>

</body>
</html>
