<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="top-bar">
    <span class="top-bar-left">
        {% if current_user.is_authenticated %}
            ◈ {{ current_user.username }}さん
        {% else %}
            ✦ 2048
        {% endif %}
        <a href="/" class="top-bar-home" onclick="confirmLeave(event, '/')">♟ トップ</a>
    </span>
    <div class="top-bar-right">
        {% if current_user.is_authenticated %}
            <a href="/logout" class="top-bar-link" onclick="confirmLeave(event, '/logout')">← ログアウト</a>
        {% else %}
            <a href="/login" class="top-bar-link">✦ ログイン</a>
            <a href="/register" class="top-bar-link">✧ 新規登録</a>
        {% endif %}
    </div>
</div>

<div class="card page-top-margin">
    <div class="gold-bar"></div>
    <h1 class="title">✦ 2048</h1>
    <p class="subtitle">— タイルを合体させて2048を作ろう —</p>

    <div class="nav-links">
        <a href="/my_records?from=2048" class="nav-link" onclick="confirmLeave(event, '/my_records?from=2048')">✦ マイ記録</a>
        <a href="/ranking?game=2048&from=2048" class="nav-link" onclick="confirmLeave(event, '/ranking?game=2048&from=2048')">❋ ランキング</a>
        <a href="/2048/howto" class="nav-link" onclick="confirmLeave(event, '/2048/howto')">✦ 遊び方</a>
    </div>

    <div class="game2048-header">
        <div class="game2048-score-box">
            <p class="game2048-score-label">スコア</p>
            <p class="game2048-score" id="score">0</p>
        </div>
        <div class="game2048-score-box">
            <p class="game2048-score-label">最高スコア</p>
            <p class="game2048-score" id="best-score">0</p>
        </div>
    </div>

    <p class="status" id="status">上下左右キーまたはスワイプで操作</p>
    <p class="clear-msg" id="clear-msg"></p>

    <div class="game2048-board" id="board"></div>

    <div class="btn-group" style="margin-top:1rem;">
        <button class="btn btn-normal" onclick="restartGame()">↺ 最初からやり直す</button>
        <button class="btn btn-easy" onclick="confirmLeaveTop(event)">☰ トップに戻る</button>
    </div>

    <div class="gold-bar" style="margin-top:1.5rem; margin-bottom:0;"></div>
</div>

<button onclick="handleBack(event)" class="back-to-top">← 戻る</button>

<script>
    const GRID = 4;
    const GAP = 8;
    let board = [];
    let score = 0;
    let bestScore = 0;
    let gameCleared = false;
    let gameOver = false;
    let isAnimating = false;
    let gameInProgress = false;
    const isLoggedIn = {{ 'true' if current_user.is_authenticated else 'false' }};

    const COLORS = {
        0:    { bg: "rgba(238,228,218,0.35)", color: "transparent" },
        2:    { bg: "#eee4da", color: "#776e65" },
        4:    { bg: "#ede0c8", color: "#776e65" },
        8:    { bg: "#f2b179", color: "#f9f6f2" },
        16:   { bg: "#f59563", color: "#f9f6f2" },
        32:   { bg: "#f67c5f", color: "#f9f6f2" },
        64:   { bg: "#f65e3b", color: "#f9f6f2" },
        128:  { bg: "#edcf72", color: "#f9f6f2" },
        256:  { bg: "#edcc61", color: "#f9f6f2" },
        512:  { bg: "#edc850", color: "#f9f6f2" },
        1024: { bg: "#edc53f", color: "#f9f6f2" },
        2048: { bg: "#edc22e", color: "#f9f6f2" },
    };

    // ===== ダイアログ =====
    function showDialog(message, onOk, okLabel = "中断する") {
        const existing = document.getElementById("custom-dialog");
        if (existing) existing.remove();
        const overlay = document.createElement("div");
        overlay.className = "dialog-overlay";
        overlay.id = "custom-dialog";
        overlay.innerHTML = `
            <div class="dialog-box">
                <p class="dialog-title">⚠ ゲームを中断しますか？</p>
                <p class="dialog-message">${message}</p>
                <div class="dialog-buttons">
                    <button class="dialog-btn-cancel" onclick="closeDialog()">キャンセル</button>
                    <button class="dialog-btn-ok" id="dialog-ok-btn">${okLabel}</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        document.getElementById("dialog-ok-btn").onclick = () => { closeDialog(); onOk(); };
    }

    function closeDialog() {
        const d = document.getElementById("custom-dialog");
        if (d) d.remove();
    }

    function confirmLeave(event, url) {
        if (!gameInProgress) {
            window.location.href = url;
            return;
        }
        event.preventDefault();
        showDialog(
            "ゲームを中断してページを移動しますか？",
            () => { window.location.href = url; }
        );
    }

    function confirmLeaveTop(event) {
        confirmLeave(event, "/");
    }

    function handleBack(event) {
        if (gameInProgress) {
            event.preventDefault();
            showDialog(
                "ゲームを中断してトップに戻りますか？",
                () => { window.location.href = "/"; }
            );
        } else {
            window.location.href = "/";
        }
    }

    // ===== ゲーム制御 =====
    function getTileSize() {
        const boardEl = document.getElementById("board");
        const w = boardEl.offsetWidth - GAP * 2;
        return (w - GAP * (GRID - 1)) / GRID;
    }

    function newGame() {
        board = Array(GRID).fill(null).map(() => Array(GRID).fill(0));
        score = 0;
        gameCleared = false;
        gameOver = false;
        gameInProgress = true;
        document.getElementById("score").textContent = "0";
        document.getElementById("clear-msg").style.display = "none";
        document.getElementById("status").style.display = "block";
        document.getElementById("status").textContent = "上下左右キーまたはスワイプで操作";
        addRandom();
        addRandom();
        render();
        updateBest();
    }

    function restartGame() {
        if (gameInProgress) {
            showDialog(
                "最初からやり直しますか？<br>現在のスコアは失われます。",
                () => { newGame(); },
                "やり直す"
            );
        } else {
            newGame();
        }
    }

    function addRandom() {
        const empty = [];
        for (let r = 0; r < GRID; r++)
            for (let c = 0; c < GRID; c++)
                if (board[r][c] === 0) empty.push([r, c]);
        if (!empty.length) return;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render(newCells = [], mergedCells = []) {
        const boardEl = document.getElementById("board");
        boardEl.innerHTML = "";
        const tileSize = getTileSize();

        for (let r = 0; r < GRID; r++) {
            for (let c = 0; c < GRID; c++) {
                const val = board[r][c];
                const tile = document.createElement("div");
                tile.className = "game2048-tile";

                const left = GAP + c * (tileSize + GAP);
                const top = GAP + r * (tileSize + GAP);
                const col = COLORS[val] || { bg: "#3a5a6e", color: "#f9f6f2" };
                const fs = val >= 1024 ? tileSize * 0.28 :
                           val >= 100  ? tileSize * 0.35 : tileSize * 0.42;

                tile.style.cssText = `
                    position: absolute;
                    width: ${tileSize}px;
                    height: ${tileSize}px;
                    left: ${left}px;
                    top: ${top}px;
                    background: ${col.bg};
                    color: ${col.color};
                    font-size: ${fs}px;
                    border-radius: 6px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-weight: 700;
                    font-family: inherit;
                    transition: all 0.1s ease;
                `;
                tile.textContent = val || "";

                const isMerged = mergedCells.some(([mr, mc]) => mr === r && mc === c);
                const isNew = newCells.some(([nr, nc]) => nr === r && nc === c);
                if (isMerged) tile.classList.add("tile-merged");
                else if (isNew) tile.classList.add("tile-new");

                boardEl.appendChild(tile);
            }
        }

        const h = GAP * 2 + GRID * tileSize + GAP * (GRID - 1);
        boardEl.style.height = h + "px";
    }

    function slide(row) {
        const nums = row.filter(v => v !== 0);
        const result = [];
        const merged = [];
        let i = 0;
        while (i < nums.length) {
            if (i + 1 < nums.length && nums[i] === nums[i + 1]) {
                const val = nums[i] * 2;
                result.push(val);
                merged.push(result.length - 1);
                score += val;
                i += 2;
            } else {
                result.push(nums[i++]);
            }
        }
        while (result.length < GRID) result.push(0);
        return { result, merged };
    }

    function move(dir) {
        if (isAnimating || gameOver) return;

        const prev = JSON.stringify(board);
        const newBoard = Array(GRID).fill(null).map(() => Array(GRID).fill(0));
        const mergedCells = [];

        for (let i = 0; i < GRID; i++) {
            let row;
            if (dir === "left")  row = board[i].slice();
            if (dir === "right") row = board[i].slice().reverse();
            if (dir === "up")    row = board.map(r => r[i]);
            if (dir === "down")  row = board.map(r => r[i]).reverse();

            const { result, merged } = slide(row);

            for (let j = 0; j < GRID; j++) {
                let tr, tc;
                if (dir === "left")  { tr = i; tc = j; }
                if (dir === "right") { tr = i; tc = GRID - 1 - j; }
                if (dir === "up")    { tr = j; tc = i; }
                if (dir === "down")  { tr = GRID - 1 - j; tc = i; }
                newBoard[tr][tc] = result[j];
                if (merged.includes(j)) mergedCells.push([tr, tc]);
            }
        }

        if (JSON.stringify(newBoard) === prev) return;

        board = newBoard;
        document.getElementById("score").textContent = score;
        updateBest();

        isAnimating = true;
        const newCells = [];
        setTimeout(() => {
            addRandom();
            for (let r = 0; r < GRID; r++)
                for (let c = 0; c < GRID; c++)
                    if (board[r][c] !== 0 &&
                        JSON.parse(prev)[r][c] === 0 &&
                        !mergedCells.some(([mr,mc]) => mr===r && mc===c))
                        newCells.push([r, c]);

            render(newCells, mergedCells);
            isAnimating = false;

            if (!gameCleared) {
                for (let r = 0; r < GRID; r++)
                    for (let c = 0; c < GRID; c++)
                        if (board[r][c] === 2048) {
                            gameCleared = true;
                            gameInProgress = false;
                            showResult(true);
                            return;
                        }
            }
            if (checkGameOver()) {
                gameOver = true;
                gameInProgress = false;
                showResult(false);
            }
        }, 120);
    }

    function checkGameOver() {
        for (let r = 0; r < GRID; r++)
            for (let c = 0; c < GRID; c++) {
                if (board[r][c] === 0) return false;
                if (c < GRID-1 && board[r][c] === board[r][c+1]) return false;
                if (r < GRID-1 && board[r][c] === board[r+1][c]) return false;
            }
        return true;
    }

    async function showResult(cleared) {
        const cl = document.getElementById("clear-msg");
        document.getElementById("status").style.display = "none";
        if (cleared) {
            cl.textContent = `✦ 2048達成！スコア：${score}`;
            cl.style.cssText = "display:block;";
        } else {
            cl.textContent = `ゲームオーバー。スコア：${score}`;
            cl.style.cssText = "display:block; color:#6e3a3a; background:#f8f0ee; border:1px solid #c9a0a0;";
        }
        if (isLoggedIn) {
            await fetch("/2048/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ score })
            });
        }
    }

    function updateBest() {
        if (score > bestScore) bestScore = score;
        document.getElementById("best-score").textContent = bestScore;
    }

    // キーボード操作
    document.addEventListener("keydown", e => {
        const map = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down" };
        if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });

    // スワイプ操作
    let tx = 0, ty = 0;
    const boardEl = document.getElementById("board");
    boardEl.addEventListener("touchstart", e => {
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
        e.preventDefault();
    }, { passive: false });

    boardEl.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].clientX - tx;
        const dy = e.changedTouches[0].clientY - ty;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
        else move(dy > 0 ? "down" : "up");
        e.preventDefault();
    }, { passive: false });

    // 起動
    window.addEventListener("load", () => { newGame(); });
</script>
</body>
</html>
