<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームセンター</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="top-bar">
    <span class="top-bar-left">
        {% if current_user.is_authenticated %}
            ◈ {{ current_user.username }}さん
        {% else %}
            ♟ ゲームセンター
        {% endif %}
    </span>
    <div class="top-bar-right">
        {% if current_user.is_authenticated %}
            <a href="/logout" class="top-bar-link">← ログアウト</a>
        {% else %}
            <a href="/login" class="top-bar-link">✦ ログイン</a>
            <a href="/register" class="top-bar-link">✧ 新規登録</a>
        {% endif %}
    </div>
</div>

<div class="card page-top-margin">
    <div class="gold-bar"></div>
    <h1 class="title">♟ ゲームセンター</h1>
    <p class="subtitle">— お好きなゲームをお選びください —</p>

    <div class="nav-links">
        <a href="/my_records" class="nav-link">✦ マイ記録</a>
        <a href="/ranking" class="nav-link">❋ ランキング</a>
    </div>

    <div class="game-select">
        <a href="/numeron" class="game-card">
            <div class="game-icon">♟</div>
            <div class="game-info">
                <p class="game-title">ヌメロン</p>
                <p class="game-desc">重複なしの数字を当てよう</p>
            </div>
            <span class="game-arrow">→</span>
        </a>
        <a href="/countdown" class="game-card">
            <div class="game-icon">✦</div>
            <div class="game-info">
                <p class="game-title">カウントダウン</p>
                <p class="game-desc">数字を計算して目標値を作ろう</p>
            </div>
            <span class="game-arrow">→</span>
        </a>
    </div>

    <div class="gold-bar" style="margin-top:1.5rem; margin-bottom:0;"></div>
</div>

</body>
</html>
